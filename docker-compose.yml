# Local dev infrastructure. Only Postgres+pgvector for now; Redis arrives in W18.
# Usage:
#   docker compose up -d
#   docker compose logs -f postgres
#   docker compose down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ce725-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ce725
      POSTGRES_PASSWORD: ce725
      POSTGRES_DB: ce725
    ports:
      - "5432:5432"
    volumes:
      - ce725_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ce725 -d ce725"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ce725_pgdata:
